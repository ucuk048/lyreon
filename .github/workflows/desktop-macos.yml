name: Build Lyreon Desktop for macOS (Apple Silicon ARM64)

on:
  push:
    branches: [ master, main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-macos.yml'
  workflow_dispatch:

jobs:
  build-macos-arm64:
    runs-on: macos-14 # Native Apple Silicon M-series ARM64 runner
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          architecture: 'aarch64'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build macOS DMG and PKG
        run: ./gradlew :desktop:packageDmg :desktop:packagePkg :desktop:packageMacArm64Jar --no-daemon

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyreon-macOS-AppleSilicon-DMG
          path: desktop/build/compose/binaries/main/dmg/*.dmg

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyreon-macOS-AppleSilicon-PKG
          path: desktop/build/compose/binaries/main/pkg/*.pkg

      - name: Upload Runnable JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lyreon-macOS-AppleSilicon-JAR
          path: desktop/build/libs/Lyreon-macos-arm64-*.jar
